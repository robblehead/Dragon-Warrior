<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Warrior (NES Edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #fcfcfc;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* Authentic 4:3 NES Screen Frame */
    #nes-screen {
      position: relative;
      width: min(94vw, calc(84vh * 256 / 240));
      aspect-ratio: 256 / 240;
      background: #000000;
      border: 4px solid #3c3c3c;
      overflow: hidden;
    }

    #nes-canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Authentic NES Double-Bordered Window */
    .nes-win {
      position: absolute;
      background: #000000;
      color: #fcfcfc;
      border: 3px solid #fcfcfc;
      box-shadow:
        0 0 0 3px #000000,
        inset 0 0 0 3px #000000,
        inset 0 0 0 5px #fcfcfc;
      padding: 10px 12px;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(9px, 1.55vw, 13px);
      line-height: 1.65;
      letter-spacing: 0.5px;
      z-index: 20;
    }

    .nes-win.low-hp {
      color: #f83800;
      border-color: #f83800;
      box-shadow:
        0 0 0 3px #000000,
        inset 0 0 0 3px #000000,
        inset 0 0 0 5px #f83800;
    }

    .win-title {
      position: absolute;
      top: -9px;
      left: 14px;
      background: #000000;
      padding: 0 6px;
      font-size: clamp(8px, 1.3vw, 11px);
      text-transform: uppercase;
    }

    /* Left Status Window */
    #status-box {
      top: 4%;
      left: 3.5%;
      min-width: 24%;
      padding: 12px 12px 8px 12px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      white-space: pre;
    }

    /* Right Command Window (2 columns x 4 rows) */
    #command-menu {
      top: 4%;
      right: 3.5%;
      width: 39%;
      padding: 14px 12px 10px 12px;
    }

    .cmd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 10px;
    }

    .menu-option {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      white-space: nowrap;
      padding: 2px 0;
    }

    .menu-option:hover .cursor-glyph,
    .menu-option.selected .cursor-glyph {
      visibility: visible;
    }

    .cursor-glyph {
      visibility: hidden;
      display: inline-block;
      width: 1em;
    }

    .menu-option.selected .cursor-glyph {
      animation: nesBlink 0.75s steps(2, start) infinite;
    }

    @keyframes nesBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Submenu (Spells, Items, Shops, Choices) */
    #sub-menu {
      top: 16%;
      right: 4%;
      min-width: 44%;
      max-width: 66%;
      max-height: 54%;
      overflow-y: auto;
      padding: 14px 14px 10px 14px;
      z-index: 30;
    }

    .sub-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sub-option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      padding: 2px 0;
    }

    .sub-option-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sub-option-row.selected .cursor-glyph,
    .sub-option-row:hover .cursor-glyph {
      visibility: visible;
    }

    .sub-option-row.selected .cursor-glyph {
      animation: nesBlink 0.75s steps(2, start) infinite;
    }

    .sub-option-row.disabled {
      color: #7c7c7c;
    }

    /* Detailed Status Sheet */
    #status-detail-window {
      top: 8%;
      right: 4%;
      width: 56%;
      padding: 16px 14px 12px 14px;
      z-index: 30;
    }

    .detail-divider {
      border-top: 2px solid #fcfcfc;
      margin: 6px 0;
    }

    /* Bottom Message Window */
    #message-window {
      bottom: 4%;
      left: 5%;
      width: 90%;
      min-height: 24%;
      max-height: 30%;
      padding: 12px 14px;
      z-index: 40;
      cursor: pointer;
    }

    #message-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    #message-advance {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 10px;
      animation: nesBlink 0.7s steps(2, start) infinite;
    }

    /* Combat Overlay */
    #combat-overlay {
      position: absolute;
      inset: 0;
      pointer-events: auto;
      z-index: 25;
    }

    /* First-Person Black Monster Portrait Frame */
    #combat-monster-frame {
      position: absolute;
      top: 26%;
      left: 50%;
      transform: translateX(-50%);
      width: 44%;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      z-index: 26;
    }

    #combat-monster-canvas {
      width: 112px;
      height: 96px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #000000;
    }

    #combat-monster-name {
      font-size: clamp(8px, 1.35vw, 11px);
      text-align: center;
      text-transform: uppercase;
    }

    /* Combat Command Menu */
    #combat-cmd-menu {
      top: 4%;
      right: 3.5%;
      width: 38%;
      padding: 14px 12px 10px 12px;
      z-index: 30;
    }

    /* Title Screen Overlay */
    #title-screen {
      position: absolute;
      inset: 0;
      background: #000000;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      gap: 24px;
    }

    .title-logo {
      font-size: clamp(18px, 3.6vw, 30px);
      line-height: 1.5;
      color: #f8b800;
      text-shadow: 3px 3px 0 #a81000;
    }

    .title-sub {
      font-size: clamp(9px, 1.4vw, 12px);
      color: #3cbcfc;
    }

    .title-menu {
      position: static;
      min-width: 56%;
      padding: 14px 18px;
      text-align: left;
    }

    /* Bottom Controls Strip outside the NES screen */
    .controls-footer {
      font-size: 9px;
      color: #7c7c7c;
      text-align: center;
      line-height: 1.9;
      padding: 2px 10px;
      max-width: 96vw;
    }

    .controls-footer button {
      background: #000000;
      color: #fcfcfc;
      border: 2px solid #7c7c7c;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 4px 8px;
      cursor: pointer;
      margin-left: 6px;
    }

    .controls-footer button:hover {
      border-color: #fcfcfc;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="nes-screen">
    <canvas id="nes-canvas" width="256" height="240"></canvas>

    <!-- Title Screen -->
    <div id="title-screen">
      <div class="title-logo">DRAGON<br>WARRIOR</div>
      <div class="title-sub">CHRONICLES OF ALEFGARD</div>
      <div class="nes-win title-menu">
        <div id="title-options" class="sub-list"></div>
      </div>
      <div style="font-size: 9px; color: #bcbcbc;">PRESS ENTER OR CLICK TO BEGIN</div>
    </div>

    <!-- Left Status Box -->
    <div id="status-box" class="nes-win hidden">
      <div id="status-name" class="win-title">ERDRICK</div>
      <div class="stat-row"><span>LV</span><span id="stat-lv">1</span></div>
      <div class="stat-row"><span>HP</span><span id="stat-hp">15</span></div>
      <div class="stat-row"><span>MP</span><span id="stat-mp">0</span></div>
      <div class="stat-row"><span>G</span><span id="stat-g">0</span></div>
      <div class="stat-row"><span>E</span><span id="stat-e">0</span></div>
    </div>

    <!-- Main 2x4 Command Window -->
    <div id="command-menu" class="nes-win hidden">
      <div class="win-title">COMMAND</div>
      <div id="command-grid" class="cmd-grid"></div>
    </div>

    <!-- Detailed Status Window -->
    <div id="status-detail-window" class="nes-win hidden">
      <div class="win-title">STATUS</div>
      <div id="status-detail-content"></div>
    </div>

    <!-- Generic List Submenu (Spells, Items, Shop, Yes/No) -->
    <div id="sub-menu" class="nes-win hidden">
      <div id="sub-menu-title" class="win-title">SPELL</div>
      <div id="sub-menu-list" class="sub-list"></div>
    </div>

    <!-- First-Person Combat Overlay -->
    <div id="combat-overlay" class="hidden">
      <div id="combat-monster-frame" class="nes-win">
        <canvas id="combat-monster-canvas" width="112" height="96"></canvas>
        <div id="combat-monster-name">SLIME</div>
      </div>
      <div id="combat-cmd-menu" class="nes-win">
        <div class="win-title">COMMAND</div>
        <div id="combat-cmd-grid" class="cmd-grid"></div>
      </div>
    </div>

    <!-- Bottom NES Dialogue / Combat Log Box -->
    <div id="message-window" class="nes-win hidden">
      <div id="message-text"></div>
      <div id="message-advance" class="hidden">▼</div>
    </div>
  </div>

  <div class="controls-footer">
    <span id="location-label">TANTEGEL CASTLE 2F</span> |
    ARROWS/WASD: MOVE &amp; CURSOR | ENTER/SPACE/Z/E: COMMAND &amp; OK | ESC/X: BACK
    <button id="btn-save-game" type="button">SAVE</button>
    <button id="btn-audio-toggle" type="button">AUDIO: ON</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
